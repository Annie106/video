<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>页面已迁移</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #111827;
            background: #f3f4f6;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 遮罩层 ===== */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            background: rgba(17, 24, 39, 0.45);
            animation: fadeIn 0.2s ease both;
        }

        /* ===== 弹窗 ===== */
        .modal {
            width: 100%;
            max-width: 520px;
            padding: 2rem 2rem 1.75rem;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.28);
        }

        .modal h1 {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0;
            color: #111827;
            margin-bottom: 0.6rem;
        }

        .modal p.desc {
            font-size: 0.925rem;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 1.5rem;
        }

        /* ===== 新链接展示框 ===== */
        .link-row {
            display: flex;
            align-items: stretch;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .link-row .link-text {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: center;
            padding: 0.6rem 0.75rem;
            font-size: 0.85rem;
            color: #1f2937;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .link-row .link-text:hover {
            border-color: #9ca3af;
            background: #f3f4f6;
        }

        .copy-btn {
            flex: 0 0 auto;
            padding: 0 0.9rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            color: #374151;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .copy-btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .copy-btn:active {
            background: #e5e7eb;
        }

        /* ===== 主按钮 ===== */
        .go-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffffff;
            background: #111827;
            border: 1px solid #111827;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .go-btn:hover {
            background: #1f2937;
            border-color: #1f2937;
        }

        .go-btn:active {
            background: #030712;
        }

        .go-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ===== 提示 toast ===== */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            font-size: 0.82rem;
            color: #ffffff;
            background: #111827;
            border-radius: 6px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 520px) {
            .modal {
                padding: 1.5rem 1.25rem 1.25rem;
            }

            .modal h1 {
                font-size: 1.1rem;
            }

            .link-row {
                flex-direction: column;
            }

            .link-row .link-text {
                white-space: normal;
                word-break: break-all;
            }

            .copy-btn {
                padding: 0.55rem 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
        <h1 id="modalTitle">此页面已迁移</h1>
        <p class="desc">
            原「直链下载」页面已更换新地址，请访问下方链接继续浏览。
        </p>

        <div class="link-row">
            <a class="link-text"
               href="https://annie106.github.io/annie106"
               target="_blank"
               rel="noopener noreferrer">
                https://annie106.github.io/annie106
            </a>
            <button class="copy-btn" id="copyBtn" type="button">复制链接</button>
        </div>

        <a class="go-btn"
           href="https://annie106.github.io/annie106"
           target="_blank"
           rel="noopener noreferrer">
            前往新页面
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6"></path>
            </svg>
        </a>
    </div>
</div>

<div id="toast" class="toast-msg">已复制链接</div>

<script>
    const NEW_URL = 'https://annie106.github.io/annie106';

    let toastTimeout = null;
    function showToast(msg) {
        const toastEl = document.getElementById('toast');
        if (!toastEl) return;
        if (toastTimeout) clearTimeout(toastTimeout);
        toastEl.style.opacity = '1';
        toastEl.innerText = msg;
        toastTimeout = setTimeout(() => {
            toastEl.style.opacity = '0';
        }, 1800);
    }

    document.getElementById('copyBtn').addEventListener('click', async () => {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(NEW_URL);
            } else {
                const ta = document.createElement('textarea');
                ta.value = NEW_URL;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            showToast('已复制链接');
        } catch (err) {
            showToast('复制失败，请手动选择链接');
        }
    });
</script>

</body>
</html>
